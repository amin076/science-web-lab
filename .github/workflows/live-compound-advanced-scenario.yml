name: Live Compound Advanced MCP Scenario

on:
  push:
    branches: [test/live-compound-advanced-mcp-scenario]
  workflow_dispatch:

jobs:
  six-second-scientific-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute exact scenario against public MCP
        run: node scripts/test-live-compound-advanced-scenario.mjs
