name: Deploy Esbiko MCP PoC

on:
  push:
    branches:
      - main
      - "feature/esbiko-*"
    paths:
      - "functions/mcp/**"
      - "functions/control/**"
      - "src/esbiko-physics/**"
      - "src/platform/control/**"
      - "scripts/test-session-bridges.mjs"
      - "scripts/test-model-sessions.mjs"
      - "src/simulations/subjects/physics/mechanics/pendulum/**"
      - "src/simulations/subjects/physics/waves/coupled-pendulums-cord/**"
      - "src/simulations/subjects/astronomy/space/solar-system/**"
      - "src/simulations/subjects/physics/mechanics/compound-pendulum/comparisonModel.js"
      - "scripts/pack-simulation-control-engine.cjs"
      - "functions/index.js"
      - "functions/api/**"
      - "src/platform/agent/**"
      - "src/simulations/subjects/**/simulation.json"
      - "src/simulations/definitions/generated.js"
      - "scripts/generate-platform-catalog.cjs"
      - "firebase.json"
      - ".github/workflows/deploy-mcp-poc.yml"
  workflow_dispatch:

concurrency:
  group: esbiko-mcp-production-deploy
  cancel-in-progress: true

jobs:
  deploy-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm ci

      - name: Generate platform and agent catalogs
        run: npm run platform:catalog

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Verify regenerated MCP discovery catalog
        run: node scripts/test-mcp-runtime.mjs

      - name: Verify shared Simulation Control API
        run: npm run test:control
      - name: Verify Wave Strings shared HTTP and MCP control
        run: node scripts/test-wave-control.mjs

      - name: Verify Coupled Pendulums shared physics, advanced API, and MCP
        run: node scripts/test-coupled-pendulum-control.mjs

      - name: Verify persistent control storage and legacy sessions
        run: node scripts/test-control-storage.mjs

      - name: Verify individual MCP operations and review annotations
        run: node scripts/test-session-tools.mjs

      - name: Verify new model sessions
        run: node scripts/test-model-sessions.mjs

      - name: Verify six rendered session bridges
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-session-bridges.mjs

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy MCP and Platform API functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@latest deploy --only functions:mcp,functions:platformApi,functions:simulationControlApi --project sience-web-app --non-interactive

      - name: Verify all six live MCP and HTTP session adapters
        run: |
          node scripts/test-control-storage-live.mjs
          node scripts/test-control-api-live.mjs
          node scripts/test-control-mcp-live.mjs
          node scripts/test-wave-control-live.mjs
          node scripts/test-coupled-pendulum-live.mjs
          node scripts/test-html-standard-live.mjs
