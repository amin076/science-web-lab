name: Deploy Esbiko MCP PoC

on:
  push:
    branches:
      - main
      - "feature/esbiko-*"
    paths:
      - "functions/mcp/**"
      - "functions/index.js"
      - "functions/api/**"
      - "src/platform/agent/**"
      - "src/simulations/subjects/**/simulation.json"
      - "src/simulations/definitions/generated.js"
      - "scripts/generate-platform-catalog.cjs"
      - "firebase.json"
      - ".github/workflows/deploy-mcp-poc.yml"
  workflow_dispatch:

concurrency:
  group: esbiko-mcp-production-deploy
  cancel-in-progress: true

jobs:
  deploy-mcp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm ci

      - name: Generate platform and agent catalogs
        run: npm run platform:catalog

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Verify regenerated MCP discovery catalog
        run: node scripts/test-mcp-runtime.mjs

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy MCP and Platform API functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@latest deploy --only functions:mcp,functions:platformApi --project sience-web-app --non-interactive
