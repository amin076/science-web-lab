name: Refresh MCP Functions Lockfile

on:
  push:
    branches:
      - feature/esbiko-mcp-v0.1-doppler
    paths:
      - "functions/package.json"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/esbiko-mcp-v0.1-doppler

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh Functions lockfile
        run: npm install --prefix functions

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build(mcp): refresh Functions lockfile"
          git push origin HEAD:feature/esbiko-mcp-v0.1-doppler
