name: Three Labs Advanced MCP Responsive
on:
  pull_request:
    paths:
      - "src/simulations/subjects/physics/optics/lens-mirror-2d/**"
      - "src/simulations/subjects/physics/electricity/circuits/**"
      - "src/simulations/subjects/creative/patterns/ambient-pattern-studio/**"
      - "src/platform/agent/simulationAgentManifest.js"
      - "src/webmcp/siteTools.js"
      - "scripts/test-three-labs-agent-browser.mjs"
      - ".github/workflows/three-labs-agent.yml"
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: npm run build
      - run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/esbiko-preview.log 2>&1 &
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/esbiko-preview.log
          exit 1
      - run: node scripts/test-three-labs-agent-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-labs-responsive-screenshots
          path: artifacts/three-agent-ready/*.png
          if-no-files-found: warn
