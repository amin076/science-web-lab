name: Deploy Esbiko Full Stack

on:
  push:
    branches:
      - main

concurrency:
  group: hosting-main-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    needs: deploy-mcp
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate 3D camera support catalog
        run: npm run platform:catalog

      - name: Build frontend
        run: npm run build

      - name: Set up Java for rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify classroom access rules
        run: |
          npm ci --prefix tests/security
          tests/security/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-esbiko-security --config firebase.emulators.json 'node tests/security/classroom-rules.mjs'

      - name: Deploy classroom rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-classroom-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,storage --project sience-web-app --non-interactive

      - name: Wait for classroom query index
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-classroom-account.json
        run: node tests/security/wait-classroom-index.mjs sience-web-app

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: sience-web-app

  deploy-mcp:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root dependencies
        run: npm ci

      - name: Generate platform and agent catalogs
        run: npm run platform:catalog

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Build SDK MCP App diagnostic (bundled single-file HTML)
        run: |
          npm install --no-save --package-lock=false --prefix functions @modelcontextprotocol/ext-apps@1.1.2 esbuild@0.25.12
          node scripts/build-mcp-sdk-diagnostic.mjs

      - name: Verify regenerated MCP discovery catalog
        run: node scripts/test-mcp-runtime.mjs

      - name: Verify automatically discovered Three.js camera adapters
        run: node scripts/test-automatic-three-camera.mjs

      - name: Verify shared camera tween contract
        run: node scripts/test-camera-session-transition.mjs

      - name: Verify visual presentation and regular polygon geometry contract
        run: |
          node scripts/test-visual-presentation.mjs
          node scripts/test-regular-polygons.mjs
      - name: Verify shared Simulation Control API
        run: npm run test:control
      - name: Verify Wave Strings shared HTTP and MCP control
        run: node scripts/test-wave-control.mjs

      - name: Verify Coupled Pendulums shared physics, advanced API, and MCP
        run: node scripts/test-coupled-pendulum-control.mjs

      - name: Verify persistent control storage and legacy sessions
        run: node scripts/test-control-storage.mjs

      - name: Verify individual MCP operations and review annotations
        run: node scripts/test-session-tools.mjs

      - name: Verify new model sessions and fractal science
        run: |
          node scripts/test-model-sessions.mjs
          node scripts/test-fractals-standard.mjs

      - name: Verify six rendered session bridges
        run: |
          npx playwright install --with-deps chromium
          node scripts/test-session-bridges.mjs
          node scripts/test-regular-polygons-browser.mjs
          node scripts/test-fractals-browser.mjs

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy MCP and Platform API functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: npx firebase-tools@latest deploy --only functions:mcp,functions:platformApi,functions:simulationControlApi --project sience-web-app --non-interactive

      - name: Verify all six live MCP and HTTP session adapters
        run: |
          node scripts/test-control-storage-live.mjs
          node scripts/test-control-api-live.mjs
          node scripts/test-control-mcp-live.mjs
          node scripts/test-wave-control-live.mjs
          node scripts/test-coupled-pendulum-live.mjs
          node scripts/test-html-standard-live.mjs
