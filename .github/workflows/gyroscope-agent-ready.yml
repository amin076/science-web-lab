name: Gyroscope Agent-Ready Responsive Test

on:
  pull_request:
    paths:
      - "src/simulations/subjects/physics/mechanics/gyroscope/**"
      - "src/platform/agent/**"
      - "scripts/test-gyroscope-responsive.mjs"
      - ".github/workflows/gyroscope-agent-ready.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright for responsive smoke
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build Esbiko
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/esbiko-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esbiko-preview.log
          exit 1

      - name: Test responsive embedded Gyroscope
        id: responsive_test
        shell: bash
        run: |
          set +e
          npm run test:gyroscope-responsive 2>&1 | tee gyroscope-responsive.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit "${code}"

      - name: Upload Gyroscope visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gyroscope-v2-responsive-artifacts
          path: |
            artifacts/gyroscope-v2/*.png
            gyroscope-responsive.log
          if-no-files-found: warn
