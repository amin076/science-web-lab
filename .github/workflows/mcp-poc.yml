name: Esbiko MCP PoC

on:
  pull_request:
    paths:
      - "functions/mcp/**"
      - "functions/index.js"
      - "src/platform/agent/**"
      - "src/simulations/**"
      - "scripts/generate-platform-catalog.cjs"
      - "scripts/test-mcp-runtime.mjs"
      - "scripts/test-simulation-agent-contract.mjs"
      - "scripts/test-satellite-education-scale.mjs"
      - "firebase.json"
      - "scripts/test-mcp-doppler.cjs"
      - "docs/ESBIKO_CHATGPT_MCP.md"
      - "package.json"
      - ".github/workflows/mcp-poc.yml"
  workflow_dispatch:

concurrency:
  group: mcp-pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate platform and agent catalogs
        run: npm run platform:catalog

      - name: Install Functions dependencies for runtime test
        run: npm ci --prefix functions

      - name: Check MCP source syntax
        run: |
          node --check functions/mcp/dopplerService.js
          node --check functions/mcp/server.js
          node --check functions/mcp/transport.mjs
          node --check functions/mcp/dopplerWidget.mjs
          node --check functions/mcp/simulationWidget.mjs
          node --check functions/mcp/simulationRegistry.mjs
          node --check src/platform/agent/readEmbeddedMcpParameters.js
          node --check scripts/test-mcp-doppler.cjs

      - name: Test MCP runtime startup
        run: node scripts/test-mcp-runtime.mjs

      - name: Test Doppler MCP proof of concept
        run: npm run test:mcp-doppler

      - name: Test reusable simulation agent contract
        run: npm run test:simulation-agent

      - name: Test Platform API
        run: npm run test:platform-api

      - name: Test WebMCP
        run: npm run test:webmcp

      - name: Validate educational orbit ordering
        run: node scripts/test-satellite-education-scale.mjs

      - name: Build Esbiko
        run: npm run build
