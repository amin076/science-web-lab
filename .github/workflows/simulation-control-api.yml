name: Simulation Control API and MCP v1

on:
  push:
    branches: [feature/simulation-control-api-mcp-v1]
    paths:
      - "functions/control/**"
      - "functions/mcp/**"
      - "functions/index.js"
      - "src/esbiko-physics/mechanics/compoundPendulum.js"
      - "src/simulations/subjects/physics/mechanics/compound-pendulum/**"
      - "src/platform/html-simulation/**"
      - "scripts/pack-simulation-control-engine.cjs"
      - "scripts/test-simulation-control.mjs"
      - "scripts/test-html-simulation-standard.mjs"
      - ".github/workflows/simulation-control-api.yml"
  pull_request:
    paths:
      - "functions/control/**"
      - "functions/mcp/**"
      - "functions/index.js"
      - "src/esbiko-physics/mechanics/compoundPendulum.js"
      - "src/simulations/subjects/physics/mechanics/compound-pendulum/**"
      - "src/platform/html-simulation/**"
      - "scripts/pack-simulation-control-engine.cjs"
      - "scripts/test-simulation-control.mjs"
  workflow_dispatch:

jobs:
  build-control-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Shared scientific model
        run: npm run test:compound-pendulum && npm run test:compound-comparison
      - name: Persistent headless API contract
        run: npm run test:control
      - name: Browser API and local WebMCP contract
        run: npm run test:html-standard
      - name: Remote MCP contract and packaging
        run: |
          npm run platform:catalog
          node scripts/test-mcp-runtime.mjs
          node --check functions/control/controlCore.mjs
          node --check functions/control/controlService.mjs
          node --check functions/control/http.mjs
          node --check functions/mcp/transport.mjs
          node --check functions/mcp/simulationWidget.mjs
      - name: Production frontend build
        run: npm run build
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-api-v1-artifacts
          path: |
            functions/api/engine/compoundPendulum.mjs
            functions/api/engine/compoundComparison.mjs
          if-no-files-found: warn
