name: Compound Pendulum Admin Pilot

on:
  push:
    branches: [feature/html-simulation-standard-v1]
    paths:
      - "src/esbiko-physics/**"
      - "src/platform/html-simulation/**"
      - "src/components/admin/examples/**"
      - "src/App.jsx"
      - "examples/compound-pendulum-preview/**"
      - "scripts/test-compound-pendulum*"
      - ".github/workflows/compound-pendulum-admin.yml"
  pull_request:
    paths:
      - "src/esbiko-physics/**"
      - "src/platform/html-simulation/**"
      - "src/components/admin/examples/**"
      - "src/App.jsx"
      - "examples/compound-pendulum-preview/**"
      - "scripts/test-compound-pendulum*"
  workflow_dispatch:

jobs:
  scientific-and-browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Physics scientific regression
        run: npm run test:compound-pendulum
      - name: Shared HTML simulation contract
        run: npm run test:html-standard
      - name: Build production frontend
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser responsive + WebMCP + actual WebM recording
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/compound-preview.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/examples/compound-pendulum-preview/index.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-compound-pendulum-browser.mjs || { cat /tmp/compound-preview.log; exit 1; }
      - name: Upload screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compound-pendulum-admin-browser-evidence
          path: |
            artifacts/compound-pendulum/*.png
            artifacts/compound-pendulum/*.webm
          if-no-files-found: warn
