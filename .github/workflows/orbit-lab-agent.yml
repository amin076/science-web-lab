name: Orbit Lab Agent Ready

on:
  pull_request:
    paths:
      - "src/simulations/subjects/astronomy/space/earth-orbit-lab/**"
      - "src/webmcp/**"
      - "src/platform/agent/**"
      - "scripts/test-orbit-lab-agent.mjs"
      - ".github/workflows/orbit-lab-agent.yml"
  push:
    branches: [main]
    paths:
      - "src/simulations/subjects/astronomy/space/earth-orbit-lab/**"
      - "src/webmcp/**"
      - "src/platform/agent/**"
      - "scripts/test-orbit-lab-agent.mjs"
  workflow_dispatch:

jobs:
  orbit-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Orbit Lab agent contracts
        run: node scripts/test-orbit-lab-agent.mjs
      - name: Build full application
        run: npm run build
