name: Live MCP Control Acceptance

on:
  workflow_run:
    workflows: [Deploy Esbiko MCP PoC]
    types: [completed]
  workflow_dispatch:

jobs:
  probe-live-mcp:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published MCP protocol tools and actual control session
        run: |
          node scripts/test-control-mcp-live.mjs
          node scripts/test-wave-control-live.mjs
