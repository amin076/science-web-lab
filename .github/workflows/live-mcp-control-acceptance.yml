name: Live MCP Control Acceptance

on:
  push:
    branches: [test/live-mcp-control-acceptance]
  workflow_dispatch:

jobs:
  probe-live-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify published MCP protocol tools and actual control session
        run: node scripts/test-control-mcp-live.mjs
