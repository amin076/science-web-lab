name: Multi Source Agent Ready

on:
  pull_request:
    paths:
      - "src/simulations/subjects/physics/waves/multi-source-interference/**"
      - "src/components/shared/video/VideoRecorderControls.jsx"
      - "src/webmcp/**"
      - "src/platform/agent/**"
      - "scripts/test-multi-source-agent.mjs"
      - "scripts/test-multi-source-responsive.mjs"
      - ".github/workflows/multi-source-agent.yml"
  push:
    branches: [main]
    paths:
      - "src/simulations/subjects/physics/waves/multi-source-interference/**"
      - "src/components/shared/video/VideoRecorderControls.jsx"
      - "src/webmcp/**"
      - "src/platform/agent/**"
      - "scripts/test-multi-source-agent.mjs"
      - "scripts/test-multi-source-responsive.mjs"
      - ".github/workflows/multi-source-agent.yml"
  workflow_dispatch:

jobs:
  multi-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate Multi Source WebMCP contracts
        run: node scripts/test-multi-source-agent.mjs
      - name: Build Esbiko application
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser responsive and WebM verification
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/multi-source-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-multi-source-responsive.mjs || { cat /tmp/multi-source-preview.log; exit 1; }
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-source-responsive-webm
          path: |
            artifacts/multi-source-agent/*.png
            artifacts/multi-source-agent/*.webm
          if-no-files-found: warn
