<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esbiko · Rope comparison beta</title><link rel="stylesheet" href="./style.css"></head><body>
<div id="comparison"><header><span class="eyebrow">ESBIKO / COMPARISON BETA</span><h1>Four ropes, one experiment</h1><p>Independent ropes · continuous waves and finite pulses</p><div class="global-actions"><button id="play-all">Play all</button><button id="pause-all">Pause all</button><button id="restart-all">Restart all together</button></div></header><div id="rope-rows"></div></div>
<template id="rope-template"><div class="lab-layout">
<section class="stage">
 <div class="modes" aria-label="End condition"><button data-boundary="traveling">Traveling wave</button><button data-boundary="free">Free end</button><button data-boundary="fixed">Fixed end</button></div>
 <div class="source-row"><label class="field">Source<select id="excitation" data-agent-param="excitation"><option value="burst">Finite sine pulse</option><option value="sine">Continuous sine</option></select></label><label class="field">Pulse length<select id="pulse-cycles" data-agent-param="pulseCycles"><option value="0.5">½ cycle</option><option value="0.75">¾ cycle</option><option value="1">1 cycle</option></select></label><button id="send-pulse">Send pulse ↻</button><span id="pulse-state" role="status"></span></div><div class="canvas-wrap"><canvas id="simulation-canvas" role="img" aria-label="Transverse rope displacement in metres; incident, reflected and total wave"></canvas></div>
 <div class="legend"><span>━ Total displacement</span><span class="incident">┄ Incident →</span><span class="reflected">┄ Reflected ←</span><label><input id="components" type="checkbox" checked> Show components</label></div>
 <div class="transport"><button id="play" data-agent-action="play">Play</button><button id="pause" data-agent-action="pause">Pause</button><button id="reset" data-agent-action="reset">Restart</button><button id="step" data-agent-action="stepOnce">Step</button><output id="time">0.00 s</output><button id="fit">Fit</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-in" aria-label="Zoom in">+</button></div>
 <div class="metrics"><div>Wave speed <strong id="speed"></strong></div><div>Wavelength <strong id="wavelength"></strong></div><div>One-way travel <strong id="travel"></strong></div></div>
 <p id="boundary-note" class="note"></p>
 
</section>
<aside><details class="settings"><summary>Rope settings, video & physics</summary><div id="sliders"></div><details><summary>Physics & assumptions</summary><div id="formulas"></div><p>Ideal uniform rope; constant tension, no damping, small transverse slopes. The vertical oscillator generates the incident wave. Its matched coupler absorbs returning waves; the rope attachment shows total displacement. A sine source ramps up over one period. Finite sine pulse duration is N/f (N = ½, ¾ or 1). Its first and last 10% are smoothly tapered; this returns the source to rest even for a ¾-cycle pulse. Send pulse restarts that row; wavelength and mean incident power describe the sinusoidal setting. Vertical displacement is magnified for visibility.</p><p id="power"></p><p id="slope-warning"></p></details><p class="hint">Changing a physical parameter restarts the wave.</p>
<details><summary>Record video</summary><div class="transport"><button id="record-landscape">Record 16:9</button><button id="record-shorts">Record 9:16</button><button id="stop-record">Stop recording</button><button id="download-record">Download</button></div><p id="recording-status" role="status"></p></details>
<p id="status" role="status"></p><details><summary>Control connection</summary><p id="mcp-status"></p></details>
</details></aside></div></template><script type="module" src="./comparison.js"></script></body></html>
